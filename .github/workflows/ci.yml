name: CI - Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values so Settings() doesn't fail in CI
      OPENAI_API_KEY: dummy
      ODOO_API_KEY: dummy
      ODOO_URL: http://dummy
      ODOO_DB: dummy
      ODOO_PROTOCOL: json2
      LLM_MODEL: dummy
      EMBEDDING_MODEL: dummy
      LANGSMITH_TRACING: "false"
      APP_ENV: test
      ODOO_READONLY_ATTESTED: "true"
      API_SHARED_SECRET: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q